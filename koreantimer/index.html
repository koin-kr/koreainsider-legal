<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="description" content="제목을 붙여 쓰는 타이머와 스톱워치. 기록이 자동으로 남습니다.">
<title>타이머</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='42' fill='black' stroke='white' stroke-width='8'/><path d='M50 26v26l16 10' stroke='white' stroke-width='8' fill='none' stroke-linecap='round'/></svg>">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  :root {
    --bg: #000;
    --fg: #fff;
    --dim: rgba(255, 255, 255, 0.55);
    --faint: rgba(255, 255, 255, 0.3);
    --line: rgba(255, 255, 255, 0.14);
    --hover: rgba(255, 255, 255, 0.07);
    --side: 300px;
    color-scheme: dark;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  :focus-visible { outline: 2px solid var(--fg); outline-offset: 3px; }

  .app {
    display: grid;
    grid-template-columns: 1fr;
    height: 100dvh;
    padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
  }

  /* ---------- 기록 사이드바 ---------- */
  .log {
    position: fixed;
    top: 0; bottom: 0; left: 0;
    z-index: 20;
    width: min(var(--side), 86vw);
    border-right: 1px solid var(--line);
    display: flex;
    flex-direction: column;
    min-height: 0;
    background: var(--bg);
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    transform: translateX(-100%);
    visibility: hidden;
    transition: transform 0.25s ease, visibility 0s linear 0.25s;
  }
  body.log-open .log {
    transform: none;
    visibility: visible;
    transition: transform 0.25s ease, visibility 0s;
  }
  .scrim {
    position: fixed; inset: 0;
    background: rgba(0, 0, 0, 0.55);
    z-index: 15;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease;
  }
  body.log-open .scrim { opacity: 1; pointer-events: auto; }
  .log-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 26px 24px 0;
  }
  .log-head h2 { font-size: 1.05rem; font-weight: 600; }
  .account { margin: 18px 24px 0; }
  .google-btn {
    width: 100%;
    height: 44px;
    border-radius: 10px;
    border: 1px solid var(--line);
    display: flex; align-items: center; justify-content: center; gap: 10px;
    font-size: 0.93rem; font-weight: 500;
  }
  .google-btn:hover { background: var(--hover); border-color: var(--faint); }
  .google-btn:disabled { opacity: 0.5; cursor: default; }
  .google-btn svg { width: 18px; height: 18px; }
  .account-note { margin-top: 8px; color: var(--faint); font-size: 0.8rem; line-height: 1.5; }
  .account-in { display: flex; align-items: center; gap: 10px; }
  .account-in[hidden], .account-out[hidden] { display: none; }
  .avatar { width: 34px; height: 34px; border-radius: 50%; background: var(--hover); flex: none; object-fit: cover; }
  .account-who { display: flex; flex-direction: column; min-width: 0; flex: 1; }
  .account-who strong { font-size: 0.9rem; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .account-who span { font-size: 0.78rem; color: var(--dim); }
  .logout { font-size: 0.8rem; color: var(--dim); padding: 6px 8px; border-radius: 8px; }
  .logout:hover { color: var(--fg); background: var(--hover); }
  .account-error { margin-top: 8px; color: #ff9a92; font-size: 0.8rem; line-height: 1.5; }
  .today {
    margin: 14px 24px 8px;
    padding-bottom: 18px;
    border-bottom: 1px solid var(--line);
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    color: var(--dim);
    font-size: 0.9rem;
  }
  .today strong { color: var(--fg); font-size: 1.35rem; font-weight: 500; font-variant-numeric: tabular-nums; }
  .log-list { list-style: none; overflow-y: auto; flex: 1; padding: 4px 12px 12px; }
  .log-day { color: var(--faint); font-size: 0.8rem; padding: 16px 12px 6px; }
  .log-item {
    position: relative;
    padding: 10px 12px;
    border-radius: 10px;
  }
  .log-item:hover { background: var(--hover); }
  .log-row { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; }
  .log-name { font-size: 0.95rem; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .log-name.untitled { color: var(--dim); font-weight: 400; }
  .log-dur { font-variant-numeric: tabular-nums; font-size: 0.9rem; white-space: nowrap; }
  .log-meta { margin-top: 3px; color: var(--dim); font-size: 0.8rem; display: flex; gap: 8px; }
  .log-meta .stopped { color: var(--faint); }
  .log-del {
    position: absolute;
    right: 6px; bottom: 6px;
    width: 26px; height: 26px;
    border-radius: 50%;
    color: var(--dim);
    opacity: 0;
    font-size: 1rem;
    line-height: 1;
  }
  .log-item:hover .log-del, .log-del:focus-visible { opacity: 1; }
  .log-del:hover { color: var(--fg); background: var(--hover); }
  .log-edit {
    position: absolute;
    right: 34px; bottom: 6px;
    width: 26px; height: 26px;
    border-radius: 50%;
    color: var(--dim);
    opacity: 0;
    display: flex; align-items: center; justify-content: center;
  }
  .log-edit svg { width: 14px; height: 14px; }
  .log-item:hover .log-edit, .log-edit:focus-visible { opacity: 1; }
  .log-edit:hover { color: var(--fg); background: var(--hover); }
  @media (hover: none) { .log-edit { opacity: 1; } }
  .log-dur.editable, .log-meta.editable span:last-child { cursor: pointer; }
  .log-dur.editable:hover, .log-meta.editable span:last-child:hover { color: var(--fg); text-decoration: underline; text-underline-offset: 3px; }
  @media (hover: none) { .log-del { opacity: 1; } }
  .log-empty { color: var(--faint); font-size: 0.9rem; line-height: 1.6; padding: 20px 24px; }
  .day-nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin: 18px 12px 0;
  }
  .day-info { display: flex; flex-direction: column; align-items: center; gap: 3px; text-align: center; }
  .day-info strong { font-size: 1rem; font-weight: 600; }
  .day-info span { font-size: 0.75rem; color: var(--faint); }
  .icon-btn:disabled { opacity: 0.2; cursor: default; background: none; }
  .log-foot { display: flex; justify-content: space-between; align-items: center; margin: 0 24px 22px; gap: 12px; }
  .day-today { font-size: 0.85rem; color: var(--dim); padding: 10px 0; margin-left: auto; }
  .day-today:hover { color: var(--fg); }
  .log-clear {
    padding: 10px 0;
    color: var(--faint);
    font-size: 0.85rem;
    text-align: left;
  }
  .log-clear:hover { color: var(--fg); }

  /* ---------- 메인 ---------- */
  main {
    position: relative;
    display: flex;
    flex-direction: column;
    min-width: 0;
    min-height: 0;
    container-type: inline-size;
  }
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 20px 28px;
  }
  .topbar-left { display: flex; align-items: center; gap: 10px; }
  .topbar-right { display: flex; align-items: center; gap: 4px; }
  #bell[aria-pressed="true"] { color: var(--fg); }
  .modes {
    display: inline-flex;
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 3px;
  }
  .modes button {
    padding: 7px 18px;
    border-radius: 999px;
    color: var(--dim);
    font-size: 0.92rem;
    font-weight: 500;
  }
  .modes button:hover { color: var(--fg); }
  .modes button[aria-pressed="true"] { background: var(--fg); color: var(--bg); }
  .icon-btn {
    width: 40px; height: 40px;
    border-radius: 50%;
    display: inline-flex; align-items: center; justify-content: center;
    color: var(--dim);
  }
  .icon-btn:hover { color: var(--fg); background: var(--hover); }
  .icon-btn svg { width: 20px; height: 20px; }

  .stage {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: clamp(20px, 3.5vh, 36px);
    padding: 0 24px 6vh;
    min-height: 0;
  }
  .title-input {
    width: min(640px, 100%);
    background: none;
    border: 0;
    border-radius: 10px;
    color: var(--fg);
    font: inherit;
    font-size: clamp(1.2rem, 3cqw, 1.75rem);
    font-weight: 500;
    text-align: center;
    padding: 8px 12px;
    outline: none;
  }
  .title-input::placeholder { color: var(--faint); }
  .title-input:hover { background: var(--hover); }
  .title-input:focus-visible { box-shadow: inset 0 0 0 1px var(--line); background: var(--hover); }

  .clock {
    display: grid;
    grid-template-columns: 52px auto 52px;
    align-items: center;
    gap: clamp(10px, 2.5cqw, 32px);
  }
  .digits {
    font-size: clamp(4rem, 22cqw, 15rem);
    font-weight: 200;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.03em;
    line-height: 1;
    white-space: nowrap;
    text-align: center;
  }
  .digits.long { font-size: clamp(3rem, 15cqw, 11rem); }
  body[data-mode="stopwatch"] .digits { font-size: clamp(3.5rem, 18cqw, 13rem); }
  body[data-mode="stopwatch"] .digits.long { font-size: clamp(2.6rem, 12.5cqw, 9.5rem); }
  .digits .cs { font-size: 0.34em; color: var(--dim); font-weight: 300; margin-left: 0.06em; letter-spacing: 0; }
  body[data-mode="timer"] .digits .cs { display: none; }

  .nudge { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .nudge-label { color: var(--faint); font-size: 0.8rem; line-height: 1; }
  .nudge button {
    width: 52px; height: 52px;
    border-radius: 50%;
    border: 1px solid var(--line);
    display: flex; align-items: center; justify-content: center;
    color: var(--dim);
    touch-action: manipulation;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
  }
  .nudge button:hover { color: var(--fg); border-color: var(--faint); }
  .nudge button:active { background: var(--hover); }
  .nudge svg { width: 18px; height: 18px; }
  body[data-mode="stopwatch"] .nudge { visibility: hidden; }

  .bar {
    width: min(520px, 80%);
    height: 2px;
    background: var(--line);
    border-radius: 2px;
    overflow: hidden;
    margin-top: -8px;
  }
  .bar i { display: block; height: 100%; background: var(--fg); transform-origin: left center; }
  body[data-mode="stopwatch"] .bar { visibility: hidden; }

  .controls { display: flex; gap: 12px; }
  .btn {
    height: 54px;
    min-width: 128px;
    padding: 0 28px;
    border-radius: 999px;
    font-size: 1rem;
    font-weight: 600;
  }
  .btn.primary { background: var(--fg); color: var(--bg); }
  .btn.primary:hover { background: rgba(255, 255, 255, 0.86); }
  .btn.ghost { border: 1px solid var(--line); color: var(--fg); font-weight: 500; }
  .btn.ghost:hover { border-color: var(--faint); background: var(--hover); }
  .btn:disabled { opacity: 0.35; cursor: default; }
  .btn.ghost:disabled:hover { border-color: var(--line); background: none; }

  .presets {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    max-width: 680px;
  }
  .preset-row {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px;
  }
  .presets button {
    padding: 9px 16px;
    border-radius: 999px;
    border: 1px solid var(--line);
    color: var(--dim);
    font-size: 0.93rem;
  }
  .presets button:hover { color: var(--fg); border-color: var(--faint); }
  .presets button.active { background: var(--fg); color: var(--bg); border-color: var(--fg); }
  body[data-mode="stopwatch"] .presets { visibility: hidden; }

  .log-add {
    margin: 8px 24px 4px;
    padding: 10px 0;
    border: 1px dashed var(--line);
    border-radius: 10px;
    color: var(--dim);
    font-size: 0.88rem;
  }
  .log-add:hover { color: var(--fg); border-color: var(--faint); }
  .log-name { cursor: text; border-radius: 6px; margin: -2px -4px; padding: 2px 4px; }
  .log-name:hover { background: var(--hover); }
  .log-name-input {
    flex: 1;
    min-width: 0;
    background: var(--hover);
    border: 1px solid var(--faint);
    border-radius: 6px;
    color: var(--fg);
    font: inherit;
    font-size: 0.95rem;
    font-weight: 500;
    padding: 2px 6px;
    margin: -3px -7px;
    outline: none;
  }

  .dialog {
    margin: auto;
    width: min(400px, calc(100vw - 32px));
    padding: 24px;
    border: 1px solid var(--line);
    border-radius: 16px;
    background: #111;
    color: var(--fg);
  }
  .dialog::backdrop { background: rgba(0, 0, 0, 0.65); }
  .dialog h3 { font-size: 1.1rem; font-weight: 600; margin-bottom: 18px; }
  .field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
  .field > span { font-size: 0.82rem; color: var(--dim); }
  .field input {
    width: 100%;
    background: transparent;
    border: 1px solid var(--line);
    border-radius: 10px;
    color: var(--fg);
    font: inherit;
    font-size: 0.95rem;
    padding: 10px 12px;
    outline: none;
  }
  .field input:focus { border-color: var(--faint); }
  .dur-inputs { display: flex; align-items: center; gap: 8px; }
  .dur-inputs input { width: 0; flex: 1; min-width: 0; font-variant-numeric: tabular-nums; }
  .dur-inputs em { font-style: normal; color: var(--dim); font-size: 0.9rem; flex: none; }
  .dur-inputs em:not(:last-child) { margin-right: 4px; }
  .dialog-error { color: #ff9a92; font-size: 0.85rem; margin: -4px 0 12px; }
  .dialog-actions { display: flex; gap: 8px; margin-top: 6px; }
  .dialog-actions .btn { flex: 1; min-width: 0; height: 46px; padding: 0 16px; }

  .toast {
    position: fixed;
    left: 50%;
    bottom: calc(24px + env(safe-area-inset-bottom, 0px));
    transform: translateX(-50%);
    max-width: min(560px, calc(100vw - 32px));
    padding: 12px 18px;
    border-radius: 12px;
    background: #1a1a1a;
    border: 1px solid var(--line);
    color: var(--fg);
    font-size: 0.9rem;
    line-height: 1.5;
    text-align: center;
    z-index: 30;
  }
  .toast[hidden] { display: none; }
  body.over .digits, body.over .digits .cs { color: #ff9a92; }
  body.ringing .digits { animation: blink 1s steps(2, start) infinite; }
  @keyframes blink { 50% { opacity: 0.18; } }


  /* ---------- 모바일 ---------- */
  @media (max-width: 820px) {
    .topbar { padding: 14px 16px; }
    .clock { grid-template-columns: 44px auto 44px; }
    .nudge button { width: 44px; height: 44px; }
    .controls { gap: 8px; }
    .btn { min-width: 0; height: 50px; padding: 0 22px; }
  }
  @media (max-height: 560px) {
    .stage { gap: 14px; padding-bottom: 12px; }
  }
  @media (prefers-reduced-motion: reduce) {
    body.ringing .digits { animation: none; }
    .log, .scrim { transition: none; }
  }
</style>
</head>
<body data-mode="timer">
<div class="app">
  <aside class="log" id="log" aria-label="기록">
    <div class="log-head">
      <h2>기록</h2>
      <button class="icon-btn log-close" id="logClose" aria-label="기록 닫기">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <div class="account" id="account" hidden>
      <div class="account-out" id="accountOut">
        <button class="google-btn" id="loginBtn">
          <svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-7.9l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>
          구글로 로그인
        </button>
        <p class="account-note">로그인하면 다른 기기에서도 같은 기록이 보여요.</p>
      </div>
      <div class="account-in" id="accountIn" hidden>
        <img class="avatar" id="avatar" alt="" referrerpolicy="no-referrer">
        <div class="account-who">
          <strong id="userName"></strong>
          <span id="syncState">동기화됨</span>
        </div>
        <button class="logout" id="logoutBtn">로그아웃</button>
      </div>
      <p class="account-error" id="accountError" hidden></p>
    </div>
    <div class="day-nav">
      <button class="icon-btn" id="dayPrev" aria-label="이전 기록 날짜">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>
      </button>
      <div class="day-info">
        <strong id="dayTitle"></strong>
        <span id="daySub"></span>
      </div>
      <button class="icon-btn" id="dayNext" aria-label="다음 기록 날짜">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
      </button>
    </div>
    <div class="today"><span>합계</span><strong id="todayTotal">0분</strong></div>
    <ol class="log-list" id="logList"></ol>
    <p class="log-empty" id="logEmpty">아직 기록이 없어요.<br>저장을 누르거나 초과된 타이머를 정지하면 여기에 남아요.</p>
    <button class="log-add" id="logAdd">+ 기록 직접 추가</button>
    <div class="log-foot">
      <button class="log-clear" id="logClear">이 날 기록 삭제</button>
      <button class="day-today" id="dayToday" hidden>오늘로 돌아가기</button>
    </div>
  </aside>

  <main>
    <div class="topbar">
      <div class="topbar-left">
        <button class="icon-btn log-toggle" id="logToggle" aria-label="기록 열기" aria-expanded="false" aria-controls="log">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h10"/></svg>
        </button>
        <div class="modes" role="group" aria-label="모드">
          <button id="modeTimer" aria-pressed="true">타이머</button>
          <button id="modeStopwatch" aria-pressed="false">스톱워치</button>
        </div>
      </div>
      <div class="topbar-right">
        <button class="icon-btn" id="bell" aria-pressed="false" aria-label="바탕화면 알림 켜기" title="바탕화면 알림 켜기"></button>
        <button class="icon-btn" id="fullscreen" aria-label="전체 화면">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
        </button>
      </div>
    </div>

    <section class="stage">
      <input class="title-input" id="title" type="text" maxlength="40" placeholder="제목 입력" aria-label="제목" autocomplete="off">

      <div class="clock">
        <div class="nudge" role="group" aria-label="분 조정">
          <button id="upMin" aria-label="1분 늘리기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 15l6-6 6 6"/></svg></button>
          <span class="nudge-label" aria-hidden="true">분</span>
          <button id="downMin" aria-label="1분 줄이기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></button>
        </div>
        <div class="digits" id="digits" role="timer"><span id="main">05:00</span><span class="cs" id="cs">.00</span></div>
        <div class="nudge" role="group" aria-label="초 조정">
          <button id="upSec" aria-label="1초 늘리기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 15l6-6 6 6"/></svg></button>
          <span class="nudge-label" aria-hidden="true">초</span>
          <button id="downSec" aria-label="1초 줄이기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></button>
        </div>
      </div>

      <div class="bar" aria-hidden="true"><i id="barFill"></i></div>

      <div class="controls">
        <button class="btn primary" id="mainBtn">시작</button>
        <button class="btn ghost" id="resetBtn">초기화</button>
        <button class="btn ghost" id="saveBtn">저장</button>
      </div>

      <div class="presets" id="presets" role="group" aria-label="시간 선택"></div>
    </section>
  </main>
</div>
<div class="scrim" id="scrim"></div>
<div class="toast" id="toast" role="status" hidden></div>
<dialog class="dialog" id="addDialog" aria-labelledby="addHeading">
  <h3 id="addHeading">기록 직접 추가</h3>
  <label class="field">
    <span>제목</span>
    <input id="addName" type="text" maxlength="40" placeholder="제목 없음" autocomplete="off">
  </label>
  <label class="field">
    <span>시작 시간</span>
    <input id="addStart" type="datetime-local">
  </label>
  <div class="field">
    <span>걸린 시간</span>
    <div class="dur-inputs">
      <input id="addH" type="number" min="0" max="24" inputmode="numeric" aria-label="시간"><em>시간</em>
      <input id="addM" type="number" min="0" max="59" inputmode="numeric" aria-label="분"><em>분</em>
      <input id="addS" type="number" min="0" max="59" inputmode="numeric" aria-label="초"><em>초</em>
    </div>
  </div>
  <p class="dialog-error" id="addError" hidden></p>
  <div class="dialog-actions">
    <button class="btn ghost" id="addCancel">취소</button>
    <button class="btn primary" id="addSave">추가</button>
  </div>
</dialog>

<script>
(() => {
  'use strict';

  // ===== 설정 =====
  const MIN_STEP = 60 * 1000;         // 왼쪽 위/아래 버튼: 1분
  const SEC_STEP = 1000;              // 오른쪽 위/아래 버튼: 1초
  const MAX = 99 * 3600 * 1000;       // 최대 99시간
  const MAX_LOCAL_LOGS = 3000;        // 로그인 안 했을 때 브라우저에 보관하는 최대 개수
  const AUTOSAVE_MS = 10 * 60 * 1000;   // 진행 중인 기록 자동 저장 간격 (10분)
  const RESUME_GAP_MS = 60 * 1000;      // 1분 넘게 꺼져 있었으면 꺼진 시점에 멈춘 걸로 보고 기록 (새로고침은 이어서 진행)
  const DAY_START_HOUR = 9;           // 하루의 시작: 오전 9시 ~ 다음날 오전 9시
  const S = 1000, M = 60 * S, H = 60 * M;
  const PRESET_ROWS = [
    [[30 * S, '30초'], [1 * M, '1분'], [3 * M, '3분'], [5 * M, '5분'], [10 * M, '10분'], [20 * M, '20분'], [30 * M, '30분']],
    [[1 * H, '1시간'], [1.5 * H, '1시간 반'], [2 * H, '2시간'], [3 * H, '3시간']]
  ];

  // ===== 저장소 =====
  const store = {
    get(key, fallback) {
      try { const v = localStorage.getItem('timer.' + key); return v === null ? fallback : JSON.parse(v); }
      catch { return fallback; }
    },
    set(key, value) {
      try { localStorage.setItem('timer.' + key, JSON.stringify(value)); } catch {}
    }
  };

  // ===== 상태 =====
  const savedDuration = store.get('duration', 5 * 60000);
  const savedLogs = store.get('logs', []);
  const state = {
    mode: store.get('mode', 'timer') === 'stopwatch' ? 'stopwatch' : 'timer',
    title: store.get('title', ''),
    logs: Array.isArray(savedLogs) ? savedLogs : [],
    timer: {
      duration: savedDuration,   // 설정한 시간
      remaining: savedDuration,  // 남은 시간 (0 아래로 내려가면 초과 시간)
      running: false,
      endAt: 0,
      runStart: 0,
      runAccum: 0,               // 실제로 흐른 시간 누적
      session: false,            // 한 번이라도 시작했는지
      planned: 0,                // 이번 세션의 목표 시간
      alerted: false,            // 0초 알림이 이미 울렸는지
      logId: null,               // 이번 세션 기록의 id (자동 저장과 최종 저장이 같은 기록을 덮어씀)
      lastAutosave: 0,
      autosaved: false
    },
    sw: { elapsed: 0, base: 0, startAt: 0, running: false, logId: null, lastAutosave: 0, autosaved: false }
  };

  // ===== DOM =====
  const $ = (id) => document.getElementById(id);
  const el = {
    title: $('title'), digits: $('digits'), main: $('main'), cs: $('cs'),
    upMin: $('upMin'), downMin: $('downMin'), upSec: $('upSec'), downSec: $('downSec'), barFill: $('barFill'),
    mainBtn: $('mainBtn'), resetBtn: $('resetBtn'), saveBtn: $('saveBtn'), presets: $('presets'),
    modeTimer: $('modeTimer'), modeStopwatch: $('modeStopwatch'),
    logList: $('logList'), logEmpty: $('logEmpty'), logClear: $('logClear'),
    todayTotal: $('todayTotal'), dayPrev: $('dayPrev'), dayNext: $('dayNext'),
    dayTitle: $('dayTitle'), daySub: $('daySub'), dayToday: $('dayToday'), logToggle: $('logToggle'), logClose: $('logClose'),
    scrim: $('scrim'), fullscreen: $('fullscreen'), bell: $('bell'), logAdd: $('logAdd'),
    addDialog: $('addDialog'), addName: $('addName'), addStart: $('addStart'), addH: $('addH'), addM: $('addM'), addS: $('addS'), addHeading: $('addHeading'),
    addError: $('addError'), addCancel: $('addCancel'), addSave: $('addSave')
  };

  // ===== 포맷 =====
  const pad = (n) => String(n).padStart(2, '0');
  function hms(ms, roundUp) {
    const t = Math.max(0, roundUp ? Math.ceil(ms / 1000) : Math.floor(ms / 1000));
    return { h: Math.floor(t / 3600), m: Math.floor((t % 3600) / 60), s: t % 60 };
  }
  function clockText(ms, roundUp) {
    const { h, m, s } = hms(ms, roundUp);
    return h > 0 ? `${h}:${pad(m)}:${pad(s)}` : `${pad(m)}:${pad(s)}`;
  }
  function durText(ms) {
    const { h, m, s } = hms(Math.round(ms / 1000) * 1000, false);
    const out = [];
    if (h) out.push(`${h}시간`);
    if (m) out.push(`${m}분`);
    if (!h && s) out.push(`${s}초`);
    return out.length ? out.join(' ') : '0초';
  }
  const DAYS = ['일', '월', '화', '수', '목', '금', '토'];
  // ts가 속한 '하루'의 시작 시각 (오전 9시 기준)
  function dayStartOf(ts) {
    const d = new Date(ts);
    const start = new Date(d.getFullYear(), d.getMonth(), d.getDate(), DAY_START_HOUR);
    if (d < start) start.setDate(start.getDate() - 1);
    return start.getTime();
  }
  function shiftDay(start, n) {
    const d = new Date(start);
    d.setDate(d.getDate() + n);
    return d.getTime();
  }
  function dateText(start) {
    const d = new Date(start);
    const base = `${d.getMonth() + 1}월 ${d.getDate()}일 (${DAYS[d.getDay()]})`;
    return d.getFullYear() === new Date().getFullYear() ? base : `${d.getFullYear()}년 ${base}`;
  }
  function relText(start) {
    const today = dayStartOf(Date.now());
    if (start === today) return '오늘';
    if (start === shiftDay(today, -1)) return '어제';
    const diff = Math.round((today - start) / 86400000);
    return diff > 0 ? `${diff}일 전` : '';
  }
  function timeLabel(ts, dayStart) {
    const t = new Date(ts).toLocaleTimeString('ko-KR', { hour: 'numeric', minute: '2-digit' });
    return new Date(ts).getDate() !== new Date(dayStart).getDate() ? `다음날 ${t}` : t;
  }

  // ===== 소리 =====
  let actx = null;
  function unlockAudio() {
    try {
      if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
      if (actx.state === 'suspended') actx.resume();
    } catch {}
  }
  let activeOscs = [];
  function beep(t0, len) {
    const o = actx.createOscillator();
    const g = actx.createGain();
    o.type = 'square';
    o.frequency.value = 2000;
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(0.12, t0 + 0.005);
    g.gain.setValueAtTime(0.12, t0 + len - 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + len);
    o.connect(g).connect(actx.destination);
    o.start(t0);
    o.stop(t0 + len + 0.02);
    activeOscs.push(o);
    o.onended = () => { activeOscs = activeOscs.filter((x) => x !== o); };
  }
  // 삐비빅 - 삐비빅 - ... 약 3초
  const RING_MS = 3000;
  function playAlarm() {
    if (!actx) return;
    try {
      const t = actx.currentTime + 0.02;
      for (let group = 0; group < 4; group++) {
        const g0 = t + group * 0.75;
        beep(g0, 0.09);
        beep(g0 + 0.13, 0.09);
        beep(g0 + 0.26, 0.09);
      }
    } catch {}
  }

  let ringTimeout = null;
  let ringing = false;
  function startRing() {
    ringing = true;
    document.body.classList.add('ringing');
    playAlarm();
    clearTimeout(ringTimeout);
    ringTimeout = setTimeout(stopRing, RING_MS);   // 3초 뒤 소리 끝, 초과 카운트는 계속됨
  }
  function stopRing() {
    if (!ringing) return;
    clearTimeout(ringTimeout);
    ringing = false;
    activeOscs.forEach((o) => { try { o.stop(); } catch {} });
    activeOscs = [];
    document.body.classList.remove('ringing');
  }

  // ===== 화면 꺼짐 방지 =====
  let wakeLock = null;
  async function syncWakeLock() {
    const want = state.timer.running || state.sw.running;
    try {
      if (want && !wakeLock && 'wakeLock' in navigator && document.visibilityState === 'visible') {
        wakeLock = await navigator.wakeLock.request('screen');
        wakeLock.addEventListener('release', () => { wakeLock = null; });
      } else if (!want && wakeLock) {
        await wakeLock.release();
        wakeLock = null;
      }
    } catch {}
  }

  // ===== 기록 =====
  // 화면에는 한 번에 '하루'(오전 9시 ~ 다음날 오전 9시)만 보여줌
  const view = { day: dayStartOf(Date.now()), logs: [], loading: false, unsub: null, prev: null };

  function saveLocal() {
    if (state.logs.length > MAX_LOCAL_LOGS) state.logs = state.logs.slice(-MAX_LOCAL_LOGS);
    store.set('logs', state.logs);
  }
  // 로그인 상태면 Firestore, 아니면 이 브라우저(localStorage)에 저장
  const newId = () => String(Date.now()) + Math.random().toString(36).slice(2, 6);
  // 같은 id가 있으면 덮어씀. jump=true면 저장한 날짜로 화면 이동
  function addLog(entry, jump = true) {
    const log = { endedAt: Date.now(), ...entry, id: entry.id || newId() };
    const day = dayStartOf(log.endedAt);
    if (cloud.user) {
      cloud.fs.setDoc(cloud.logDoc(log.id), log).catch(onCloudError);
      if (jump && view.day !== day) setViewDay(day);
      else updateNav();
      return;
    }
    const i = state.logs.findIndex((l) => l.id === log.id);
    if (i >= 0) state.logs[i] = log; else state.logs.push(log);
    saveLocal();
    if (jump && view.day !== day) setViewDay(day);
    else watchView();
  }
  // 기존 기록의 일부만 바꿈 (이름 수정 등)
  function updateLog(log, changes) {
    const next = { ...log, ...changes };
    if (cloud.user) {
      cloud.fs.setDoc(cloud.logDoc(log.id), next).catch(onCloudError);
      return;
    }
    const i = state.logs.findIndex((l) => l.id === log.id);
    if (i >= 0) { state.logs[i] = next; saveLocal(); }
    watchView();
  }
  function removeLog(id) {
    if (cloud.user) {
      cloud.fs.deleteDoc(cloud.logDoc(id)).catch(onCloudError);
      return;
    }
    state.logs = state.logs.filter((l) => l.id !== id);
    saveLocal();
    watchView();
  }
  function clearViewDay() {
    const ids = new Set(view.logs.map((l) => l.id));
    if (!ids.size) return;
    if (cloud.user) {
      const batch = cloud.fs.writeBatch(cloud.db);
      [...ids].slice(0, 450).forEach((id) => batch.delete(cloud.logDoc(id)));
      batch.commit().then(updateNav).catch(onCloudError);
      return;
    }
    state.logs = state.logs.filter((l) => !ids.has(l.id));
    saveLocal();
    watchView();
  }

  function setViewDay(day) {
    view.day = day;
    watchView();
  }
  // 보고 있는 하루의 기록을 불러오고, 로그인 상태면 실시간으로 지켜봄
  function watchView() {
    if (view.unsub) { view.unsub(); view.unsub = null; }
    const start = view.day, end = shiftDay(start, 1);
    if (cloud.user) {
      const { fs } = cloud;
      const q = fs.query(cloud.logsCol(), fs.where('endedAt', '>=', start), fs.where('endedAt', '<', end), fs.orderBy('endedAt', 'desc'));
      view.logs = [];
      view.loading = true;
      renderLogs();
      view.unsub = fs.onSnapshot(q, { includeMetadataChanges: true }, (snap) => {
        if (view.day !== start) return;
        view.loading = false;
        view.logs = snap.docs.map((d) => ({ ...d.data(), id: d.id }));
        acc.sync.textContent = snap.metadata.hasPendingWrites ? '저장 중…' : snap.metadata.fromCache ? '오프라인, 연결되면 올라가요' : '동기화됨';
        renderLogs();
      }, (e) => { view.loading = false; renderLogs(); onCloudError(e); });
    } else {
      view.loading = false;
      view.logs = state.logs.filter((l) => l.endedAt >= start && l.endedAt < end).sort((a, b) => b.endedAt - a.endedAt);
      renderLogs();
    }
    updateNav();
  }
  // 기록이 있는 바로 이전(-1) / 다음(+1) 하루 찾기. 없으면 null
  async function findAdjacentDay(dir) {
    const start = view.day, end = shiftDay(start, 1);
    if (cloud.user) {
      const { fs } = cloud;
      const q = dir < 0
        ? fs.query(cloud.logsCol(), fs.where('endedAt', '<', start), fs.orderBy('endedAt', 'desc'), fs.limit(1))
        : fs.query(cloud.logsCol(), fs.where('endedAt', '>=', end), fs.orderBy('endedAt', 'asc'), fs.limit(1));
      const snap = await fs.getDocs(q);
      return snap.empty ? null : dayStartOf(snap.docs[0].data().endedAt);
    }
    const times = state.logs.map((l) => l.endedAt).filter((t) => (dir < 0 ? t < start : t >= end));
    if (!times.length) return null;
    return dayStartOf(dir < 0 ? Math.max(...times) : Math.min(...times));
  }
  let navToken = 0;
  async function updateNav() {
    const token = ++navToken;
    const today = dayStartOf(Date.now());
    el.dayNext.disabled = view.day >= today;
    el.dayToday.hidden = view.day === today;
    try {
      const prev = await findAdjacentDay(-1);
      if (token !== navToken) return;
      view.prev = prev;
      el.dayPrev.disabled = prev === null;
    } catch (e) { onCloudError(e); }
  }
  async function goDay(dir) {
    const today = dayStartOf(Date.now());
    try {
      if (dir < 0) {
        const prev = view.prev !== null ? view.prev : await findAdjacentDay(-1);
        if (prev !== null) setViewDay(prev);
      } else {
        if (view.day >= today) return;
        let next = await findAdjacentDay(1);
        if (next === null || next > today) next = today;
        setViewDay(next);
      }
    } catch (e) { onCloudError(e); }
  }

  // ===== Firebase 동기화 =====
  const FIREBASE_VERSION = '10.12.2';
  const cloud = { ready: false, user: null, auth: null, authM: null, fs: null, db: null, logDoc: null, logsCol: null };
  const acc = {
    box: $('account'), out: $('accountOut'), inn: $('accountIn'), login: $('loginBtn'), logout: $('logoutBtn'),
    avatar: $('avatar'), name: $('userName'), sync: $('syncState'), error: $('accountError')
  };

  function showAccountError(msg) {
    acc.error.textContent = msg || '';
    acc.error.hidden = !msg;
  }
  function onCloudError(err) {
    console.error(err);
    if (err && err.code === 'permission-denied') {
      showAccountError('저장 권한이 없어요. Firestore 보안 규칙을 확인해 주세요.');
    } else {
      showAccountError('동기화 중 문제가 생겼어요. 잠시 후 다시 시도해 주세요.');
    }
  }
  function renderAccount() {
    acc.box.hidden = !cloud.ready;
    const u = cloud.user;
    acc.out.hidden = !!u;
    acc.inn.hidden = !u;
    if (u) {
      acc.name.textContent = u.displayName || u.email || '로그인됨';
      if (u.photoURL) { acc.avatar.src = u.photoURL; acc.avatar.hidden = false; }
      else acc.avatar.hidden = true;
    }
  }

  async function initCloud() {
    let cfg;
    try { ({ firebaseConfig: cfg } = await import('./firebase-config.js')); } catch { return; }
    if (!cfg || !cfg.apiKey || String(cfg.apiKey).startsWith('YOUR')) return;   // 설정 전이면 로컬 모드

    const base = `https://www.gstatic.com/firebasejs/${FIREBASE_VERSION}/`;
    let appM, authM, fs;
    try {
      [appM, authM, fs] = await Promise.all([
        import(base + 'firebase-app.js'),
        import(base + 'firebase-auth.js'),
        import(base + 'firebase-firestore.js')
      ]);
    } catch (e) { console.error(e); return; }

    const app = appM.initializeApp(cfg);
    let db;
    try {
      db = fs.initializeFirestore(app, { localCache: fs.persistentLocalCache({ tabManager: fs.persistentMultipleTabManager() }) });
    } catch { db = fs.getFirestore(app); }

    Object.assign(cloud, { ready: true, auth: authM.getAuth(app), authM, fs, db });
    cloud.auth.languageCode = 'ko';
    authM.getRedirectResult(cloud.auth).catch(() => {});
    authM.onAuthStateChanged(cloud.auth, onUserChange);
    renderAccount();
  }

  async function onUserChange(user) {
    const { fs, db } = cloud;
    cloud.user = null;                 // 옮기는 동안은 로컬 기준
    showAccountError('');

    if (!user) {
      cloud.logDoc = cloud.logsCol = null;
      const local = store.get('logs', []);
      state.logs = Array.isArray(local) ? local : [];
      renderAccount();
      watchView();
      return;
    }

    const logDoc = (id) => fs.doc(db, 'users', user.uid, 'logs', id);
    acc.name.textContent = user.displayName || user.email || '로그인됨';

    // 로그인 전 이 브라우저에 쌓인 기록을 계정으로 옮김 (같은 id라 여러 번 올려도 중복 안 됨)
    const local = store.get('logs', []);
    if (Array.isArray(local) && local.length) {
      try {
        for (let i = 0; i < local.length; i += 450) {
          const batch = fs.writeBatch(db);
          local.slice(i, i + 450).forEach((l) => batch.set(logDoc(String(l.id)), { ...l, id: String(l.id) }));
          await batch.commit();
        }
        store.set('logs', []);
        state.logs = [];
      } catch (e) { onCloudError(e); }
    }
    if (cloud.auth.currentUser !== user) return;   // 그 사이 로그아웃됨

    cloud.user = user;
    cloud.logDoc = logDoc;
    cloud.logsCol = () => fs.collection(db, 'users', user.uid, 'logs');
    renderAccount();
    watchView();
  }

  async function login() {
    if (!cloud.ready) return;
    const { authM, auth } = cloud;
    const provider = new authM.GoogleAuthProvider();
    provider.setCustomParameters({ prompt: 'select_account' });
    acc.login.disabled = true;
    showAccountError('');
    try {
      await authM.signInWithPopup(auth, provider);
    } catch (e) {
      if (e.code === 'auth/popup-blocked' || e.code === 'auth/operation-not-supported-in-this-environment') {
        await authM.signInWithRedirect(auth, provider).catch((err) => showAccountError('로그인하지 못했어요.'));
      } else if (e.code === 'auth/unauthorized-domain') {
        showAccountError(`Firebase 승인된 도메인에 ${location.hostname} 을(를) 추가해 주세요.`);
      } else if (e.code !== 'auth/popup-closed-by-user' && e.code !== 'auth/cancelled-popup-request') {
        console.error(e);
        showAccountError('로그인하지 못했어요. 잠시 후 다시 시도해 주세요.');
      }
    } finally {
      acc.login.disabled = false;
    }
  }
  async function logout() {
    if (!cloud.ready) return;
    await cloud.authM.signOut(cloud.auth).catch(() => {});
  }

  // ===== 타이머 =====
  const isOver = () => state.timer.session && state.timer.remaining <= 0;
  function timerElapsed() {
    const T = state.timer;
    return T.runAccum + (T.running ? Date.now() - T.runStart : 0);
  }
  function timerStart() {
    const T = state.timer;
    if (!T.session && T.remaining <= 0) return;
    unlockAudio();
    const now = Date.now();
    askNotifyOnce();
    if (!T.session) {
      T.session = true; T.planned = T.remaining; T.runAccum = 0; T.alerted = false;
      T.logId = newId(); T.lastAutosave = now; T.autosaved = false;
    }
    T.running = true;
    T.endAt = now + T.remaining;
    T.runStart = now;
    syncWakeLock();
  }
  function timerPause() {
    const T = state.timer;
    if (!T.running) return;
    const now = Date.now();
    T.remaining = T.endAt - now;
    T.runAccum += now - T.runStart;
    T.running = false;
    syncWakeLock();
  }
  // discard=true: 기록 없이 버림 (자동 저장된 게 있으면 지움)
  function clearTimerSession(discard = false) {
    const T = state.timer;
    if (discard && T.session && T.autosaved && T.logId) removeLog(T.logId);
    T.logId = null;
    T.autosaved = false;
    stopRing();
    T.running = false;
    T.session = false;
    T.runAccum = 0;
    T.alerted = false;
    T.remaining = T.duration;
    syncWakeLock();
  }
  // 지금까지 흐른 시간을 기록으로 남기고 처음 시간으로 되돌림
  function saveTimer() {
    const T = state.timer;
    if (!T.session) return false;
    if (T.running) T.remaining = T.endAt - Date.now();
    const actual = timerElapsed();
    const over = Math.max(0, -T.remaining);
    const done = T.remaining <= 0;
    if (actual < 1000 && !done) { clearTimerSession(true); return false; }
    const entry = {
      id: T.logId,
      type: 'timer',
      title: state.title.trim(),
      planned: T.planned,
      actual,
      over,
      status: done ? '완료' : '저장'
    };
    clearTimerSession();   // 먼저 세션을 정리해야 기록 목록이 '진행 중'으로 남지 않음
    addLog(entry);
    return true;
  }
  function setDuration(ms) {
    const T = state.timer;
    clearTimerSession(true);
    T.duration = ms;
    T.remaining = ms;
    store.set('duration', ms);
    render();
  }
  function nudge(dir, step) {
    if (state.mode !== 'timer') return;
    const T = state.timer;
    if (T.running) {
      const now = Date.now();
      const before = T.endAt - now;
      if (before <= 0 && dir < 0) return;           // 초과 중에는 줄이기 없음
      const after = Math.min(MAX, Math.max(1000, before + dir * step));
      T.endAt = now + after;
      T.planned = Math.max(0, T.planned + (after - before));
      T.remaining = after;
    } else {
      const before = T.remaining;
      if (T.session && before <= 0 && dir < 0) return;
      const after = Math.min(MAX, Math.max(0, before + dir * step));
      T.remaining = after;
      if (T.session) {
        T.planned = Math.max(0, T.planned + (after - before));
      } else {
        T.duration = after;
        store.set('duration', after);
      }
    }
    if (T.remaining > 0) { T.alerted = false; stopRing(); }
    render();
  }

  // ===== 스톱워치 =====
  function swNow() {
    const S = state.sw;
    return S.running ? S.base + (Date.now() - S.startAt) : S.elapsed;
  }
  function swStart() {
    const S = state.sw;
    unlockAudio();
    if (!S.logId) { S.logId = newId(); S.lastAutosave = Date.now(); S.autosaved = false; }
    S.base = S.elapsed;
    S.startAt = Date.now();
    S.running = true;
    syncWakeLock();
  }
  function swPause() {
    const S = state.sw;
    if (!S.running) return;
    S.elapsed = swNow();
    S.running = false;
    syncWakeLock();
  }
  function saveSw() {
    const S = state.sw;
    swPause();
    const saved = S.elapsed >= 1000;
    const id = S.logId, actual = S.elapsed, wasAutosaved = S.autosaved;
    S.elapsed = 0;
    S.logId = null;
    S.autosaved = false;
    if (saved) addLog({ id: id || undefined, type: 'stopwatch', title: state.title.trim(), actual, status: '스톱워치' });
    else if (wasAutosaved && id) removeLog(id);
    return saved;
  }

  // ===== 동작 =====
  function primaryAction() {
    if (state.mode === 'timer') {
      const T = state.timer;
      if (T.running && isOver()) saveTimer();   // 초과 중 '정지' = 끝내고 기록
      else if (T.running) timerPause();
      else timerStart();
    } else {
      state.sw.running ? swPause() : swStart();
    }
    render();
  }
  function resetAction() {
    if (state.mode === 'timer') {
      const T = state.timer;
      if (T.session) {
        clearTimerSession(true);        // 진행 중이면 설정했던 시간으로 (기록 없이)
      } else {
        T.duration = 0;                 // 설정 중이면 00:00으로
        T.remaining = 0;
        store.set('duration', 0);
      }
    }
    else {
      const S = state.sw;
      swPause();
      if (S.autosaved && S.logId) removeLog(S.logId);
      S.elapsed = 0; S.logId = null; S.autosaved = false;
      syncWakeLock();
    }
    render();
  }
  let savedFlash = null;
  function saveAction() {
    const ok = state.mode === 'timer' ? saveTimer() : saveSw();
    if (ok) {
      el.saveBtn.textContent = '저장됨';
      clearTimeout(savedFlash);
      savedFlash = setTimeout(() => { savedFlash = null; el.saveBtn.textContent = '저장'; render(); }, 1200);
    }
    render();
  }
  function setMode(mode) {
    state.mode = mode;
    store.set('mode', mode);
    render();
  }

  // ===== 바탕화면 알림 =====
  const notifySupported = 'Notification' in window;
  let notifyOn = store.get('notify', false);
  let doneNotice = null;
  const BELL_ON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>';
  const BELL_OFF = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8.7 3A6 6 0 0 1 18 8a21.3 21.3 0 0 0 .6 5"/><path d="M17 17H3s3-2 3-9a4.67 4.67 0 0 1 .3-1.7"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/><path d="m2 2 20 20"/></svg>';

  const notifyActive = () => notifySupported && notifyOn && Notification.permission === 'granted';
  function renderBell() {
    if (!notifySupported) { el.bell.hidden = true; return; }
    const on = notifyActive();
    const label = on ? '바탕화면 알림 끄기' : '바탕화면 알림 켜기';
    el.bell.innerHTML = on ? BELL_ON : BELL_OFF;
    el.bell.setAttribute('aria-pressed', String(on));
    el.bell.setAttribute('aria-label', label);
    el.bell.title = label;
  }
  async function turnOnNotify() {
    const perm = Notification.permission === 'granted' ? 'granted' : await Notification.requestPermission();
    notifyOn = perm === 'granted';
    store.set('notify', notifyOn);
    renderBell();
    return notifyOn;
  }
  async function toggleBell() {
    if (!notifySupported) return;
    if (Notification.permission === 'denied') {
      alert('브라우저에서 이 사이트 알림이 차단돼 있어요.\n주소창 왼쪽 아이콘을 눌러 알림을 "허용"으로 바꾼 뒤 다시 눌러 주세요.');
      return;
    }
    if (notifyActive()) {
      notifyOn = false;
      store.set('notify', false);
      renderBell();
      return;
    }
    if (await turnOnNotify()) {
      try { new Notification('바탕화면 알림이 켜졌어요', { body: '다른 창을 보고 있어도 시간이 다 되면 알려드릴게요.', tag: 'timer-test', silent: true }); } catch {}
    }
  }
  // 처음 타이머를 시작할 때 한 번만 알림 허용을 물어봄
  function askNotifyOnce() {
    if (!notifySupported || store.get('notifyAsked', false)) return;
    store.set('notifyAsked', true);
    if (Notification.permission === 'default') turnOnNotify();
    else if (Notification.permission === 'granted' && !notifyOn) { notifyOn = true; store.set('notify', true); renderBell(); }
  }
  function notifyDone() {
    if (!notifyActive()) return;
    if (document.visibilityState === 'visible' && document.hasFocus()) return;   // 보고 있으면 화면 알림으로 충분
    const T = state.timer;
    const name = state.title.trim();
    try {
      doneNotice = new Notification('시간이 다 됐어요', {
        body: `${name ? name + ' ' : ''}${durText(T.planned)}${durText(T.planned).endsWith('초') ? '가' : '이'} 끝났어요. 지금부터 초과 시간을 세고 있어요.`,
        tag: 'timer-done',
        renotify: true,
        requireInteraction: true
      });
      doneNotice.onclick = () => { window.focus(); doneNotice && doneNotice.close(); };
    } catch {}
  }
  function closeDoneNotice() {
    if (doneNotice) { try { doneNotice.close(); } catch {} doneNotice = null; }
  }

  // 백그라운드 탭에서도 끝나는 순간 바로 깨어나도록 종료 시각에 맞춰 한 번 예약
  let doneTimer = null, doneFor = 0;
  function scheduleDone() {
    const T = state.timer;
    const want = T.running && !T.alerted ? T.endAt : 0;
    if (want === doneFor) return;
    clearTimeout(doneTimer);
    doneFor = want;
    if (want) doneTimer = setTimeout(() => { doneFor = 0; tick(); }, Math.max(0, want - Date.now()) + 15);
  }

  // ===== 자동 저장 =====
  // 진행 중인 세션을 10분마다 기록에 올려둠. 끝까지 저장하면 같은 기록이 최종본으로 덮어써짐
  function autosave(force = false) {
    const now = Date.now();
    const T = state.timer, S = state.sw, title = state.title.trim();
    if (T.session && T.running) {
      const actual = timerElapsed();
      if (actual >= 60000 && (force || now - T.lastAutosave >= AUTOSAVE_MS)) {
        T.lastAutosave = now;
        T.autosaved = true;
        addLog({ id: T.logId, type: 'timer', title, planned: T.planned, actual, over: Math.max(0, now - T.endAt), status: '자동저장', endedAt: now }, false);
      }
    }
    if (S.running && S.logId) {
      const actual = swNow();
      if (actual >= 60000 && (force || now - S.lastAutosave >= AUTOSAVE_MS)) {
        S.lastAutosave = now;
        S.autosaved = true;
        addLog({ id: S.logId, type: 'stopwatch', title, actual, status: '자동저장', endedAt: now }, false);
      }
    }
  }

  // 새로고침하거나 브라우저가 꺼졌다 켜져도 이어서 돌아가도록 진행 상태를 계속 보관
  function persistLive() {
    store.set('live', { t: state.timer, s: state.sw, seen: Date.now() });
  }
  let recoveredAt = 0;
  function showToast(msg, ms = 7000) {
    const t = $('toast');
    t.textContent = msg;
    t.hidden = false;
    clearTimeout(showToast.timer);
    showToast.timer = setTimeout(() => { t.hidden = true; }, ms);
  }
  function restoreLive() {
    const live = store.get('live', null);
    if (!live || !live.t || !live.s) return;
    const seen = live.seen || 0;
    const longGone = Date.now() - seen > RESUME_GAP_MS;
    const title = state.title.trim();
    const T = state.timer, S = state.sw;

    if (live.t.session) {
      Object.assign(T, live.t);
      if (T.running && longGone) {
        // 오래 꺼져 있었으면 꺼진 시점에 멈춘 상태로 되살리고, 그때까지를 기록
        const actual = T.runAccum + Math.max(0, seen - T.runStart);
        T.remaining = T.endAt - seen;
        T.runAccum = actual;
        T.running = false;
        if (T.remaining <= 0) T.alerted = true;
        if (actual >= 1000) {
          addLog({ id: T.logId, type: 'timer', title, planned: T.planned, actual, over: Math.max(0, -T.remaining), status: '자동저장', endedAt: seen }, false);
        }
        T.autosaved = false;   // 이 기록은 초기화해도 지우지 않음
        recoveredAt = seen;
      } else if (T.running) {
        T.remaining = T.endAt - Date.now();
      }
    }
    if (live.s.running || live.s.elapsed > 0) {
      Object.assign(S, live.s);
      if (S.running && longGone) {
        // 꺼진 시점 값 그대로 멈춰 두고, 그때까지를 기록
        const actual = S.base + Math.max(0, seen - S.startAt);
        S.elapsed = actual;
        S.base = actual;
        S.running = false;
        if (!S.logId) S.logId = newId();
        if (actual >= 1000) {
          addLog({ id: S.logId, type: 'stopwatch', title, actual, status: '자동저장', endedAt: seen }, false);
        }
        S.autosaved = false;   // 이 기록은 초기화해도 지우지 않음
        recoveredAt = seen;
      }
    }
  }

  // ===== 렌더 =====
  let lastMain = '', lastCs = '', lastDocTitle = '';
  function render() {
    scheduleDone();
    const isTimer = state.mode === 'timer';
    const T = state.timer, S = state.sw;
    const over = isOver();
    document.body.dataset.mode = state.mode;
    document.body.classList.toggle('over', isTimer && over);
    el.modeTimer.setAttribute('aria-pressed', String(isTimer));
    el.modeStopwatch.setAttribute('aria-pressed', String(!isTimer));

    let mainText, csText = '';
    if (isTimer) {
      mainText = over ? '+' + clockText(-T.remaining, false) : clockText(T.remaining, true);
    } else {
      const ms = swNow();
      mainText = clockText(ms, false);
      csText = '.' + pad(Math.floor((ms % 1000) / 10));
    }
    if (mainText !== lastMain) {
      el.main.textContent = mainText;
      el.digits.classList.toggle('long', mainText.replace('+', '').length > 5);
      lastMain = mainText;
    }
    if (csText !== lastCs) { el.cs.textContent = csText; lastCs = csText; }

    // 진행 막대
    const total = T.session ? T.planned : T.duration;
    const ratio = total > 0 ? Math.min(1, Math.max(0, T.remaining / total)) : 0;
    el.barFill.style.transform = `scaleX(${ratio})`;

    // 버튼
    if (isTimer) {
      el.mainBtn.textContent = T.running && over ? '정지' : T.running ? '일시정지' : T.session ? '계속' : '시작';
      el.saveBtn.disabled = !T.session && !savedFlash;
    } else {
      el.mainBtn.textContent = S.running ? '정지' : S.elapsed > 0 ? '계속' : '시작';
      el.saveBtn.disabled = !S.running && S.elapsed === 0 && !savedFlash;
    }

    // 프리셋 활성 표시
    for (const b of el.presets.querySelectorAll('button')) {
      b.classList.toggle('active', Number(b.dataset.ms) === T.duration && !T.session);
    }

    // 탭 제목
    const name = state.title.trim();
    const suffix = name ? ' ' + name : '';
    let docTitle = '타이머';
    if (T.running && over) docTitle = `⏰ +${clockText(-T.remaining, false)} 초과${suffix}`;
    else if (T.running) docTitle = `${clockText(T.remaining, true)}${suffix}`;
    else if (S.running) docTitle = `${clockText(swNow(), false)}${suffix}`;
    if (docTitle !== lastDocTitle) { document.title = docTitle; lastDocTitle = docTitle; }
  }

  let editingId = null;
  function renderLogs() {
    if (editingId) return;   // 이름 고치는 중에는 목록을 다시 그리지 않음
    const logs = view.logs;
    const today = dayStartOf(Date.now());
    el.dayTitle.textContent = dateText(view.day);
    const rel = relText(view.day);
    el.daySub.textContent = (rel ? rel + ', ' : '') + '오전 9시 기준';
    el.daySub.title = '오전 9시부터 다음날 오전 9시까지를 하루로 묶어요';

    el.logList.textContent = '';
    el.logEmpty.hidden = logs.length > 0;
    el.logEmpty.innerHTML = view.loading ? '불러오는 중…'
      : view.day === today ? '아직 오늘 기록이 없어요.<br>저장을 누르거나 초과된 타이머를 정지하면 여기에 남아요.'
      : '이 날은 기록이 없어요.';
    el.logClear.hidden = logs.length === 0;

    for (const log of logs) {
      const li = document.createElement('li');
      li.className = 'log-item';

      const row = document.createElement('div');
      row.className = 'log-row';
      const name = document.createElement('span');
      name.className = 'log-name' + (log.title ? '' : ' untitled');
      name.textContent = log.title || '제목 없음';
      name.title = '눌러서 이름 바꾸기';
      name.tabIndex = 0;
      name.setAttribute('role', 'button');
      name.addEventListener('click', () => startRename(name, log));
      name.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); startRename(name, log); } });
      const dur = document.createElement('span');
      dur.className = 'log-dur';
      dur.textContent = durText(log.actual);
      row.append(name, dur);

      const meta = document.createElement('div');
      meta.className = 'log-meta';
      const tag = document.createElement('span');
      const liveT = log.id === state.timer.logId, liveS = log.id === state.sw.logId;
      const live = liveT || liveS;
      const liveRunning = liveT ? state.timer.running : state.sw.running;
      if (log.type === 'manual') {
        tag.textContent = '직접 추가';
      } else if (log.type === 'timer') {
        if (live) {
          tag.textContent = liveRunning ? '진행 중, 자동 저장됨' : '멈춤, 자동 저장됨';
        } else if (log.status === '완료') {
          tag.textContent = log.over >= 1000 ? `완료, ${durText(log.over)} 초과` : '타이머 완료';
        } else if (log.status === '자동저장') {
          tag.textContent = `자동 저장, 목표 ${durText(log.planned)}`;
          tag.className = 'stopped';
        } else {
          tag.textContent = `${log.status === '저장' ? '저장' : '중단'}, 목표 ${durText(log.planned)}`;
          tag.className = 'stopped';
        }
      } else {
        tag.textContent = live ? (liveRunning ? '스톱워치 진행 중, 자동 저장됨' : '스톱워치 멈춤, 자동 저장됨') : log.status === '자동저장' ? '스톱워치, 자동 저장' : '스톱워치';
      }
      const time = document.createElement('span');
      time.textContent = log.startedAt
        ? `${timeLabel(log.startedAt, view.day)} ~ ${timeLabel(log.endedAt, view.day)}`
        : timeLabel(log.endedAt, view.day);
      meta.append(tag, time);

      const del = document.createElement('button');
      del.className = 'log-del';
      del.setAttribute('aria-label', '이 기록 삭제');
      del.textContent = '×';
      del.addEventListener('click', () => removeLog(log.id));

      // 시간 수정: 연필 버튼, 또는 걸린 시간/시각을 눌러서
      const edit = document.createElement('button');
      edit.className = 'log-edit';
      edit.setAttribute('aria-label', '이 기록 시간 수정');
      edit.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.85 2.85 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/></svg>';
      const openEdit = () => {
        if (live) { showToast('진행 중인 기록은 끝내고 나서 시간을 고칠 수 있어요.', 3500); return; }
        openLogDialog(log);
      };
      edit.addEventListener('click', openEdit);
      dur.classList.add('editable');
      dur.addEventListener('click', openEdit);
      meta.classList.add('editable');
      time.addEventListener('click', openEdit);

      li.append(row, meta, edit, del);
      el.logList.appendChild(li);
    }

    const totalMs = logs.reduce((sum, l) => sum + (l.actual || 0), 0);
    el.todayTotal.textContent = totalMs >= 60000 ? durText(Math.floor(totalMs / 60000) * 60000) : durText(totalMs);
  }

  function startRename(nameEl, log) {
    if (editingId) return;
    editingId = log.id;
    const isLive = log.id === state.timer.logId || log.id === state.sw.logId;
    const input = document.createElement('input');
    input.className = 'log-name-input';
    input.value = log.title || '';
    input.maxLength = 40;
    input.placeholder = '제목 없음';
    input.setAttribute('aria-label', '기록 이름');
    nameEl.replaceWith(input);
    input.focus();
    input.select();

    let done = false;
    const finish = (commit) => {
      if (done) return;
      done = true;
      editingId = null;
      const value = input.value.trim();
      if (commit && value !== (log.title || '')) {
        if (isLive) {   // 진행 중인 기록이면 위쪽 제목도 같이 바꿔야 최종 저장 때 유지됨
          state.title = value;
          el.title.value = value;
          store.set('title', value);
        }
        updateLog(log, { title: value });
      }
      renderLogs();
    };
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') { e.preventDefault(); finish(true); }
      else if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); finish(false); }
    });
    input.addEventListener('blur', () => finish(true));
  }

  // 직접 추가
  function toLocalInput(ts) {
    const d = new Date(ts);
    return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
  }
  // log가 있으면 수정, 없으면 직접 추가
  let dialogLog = null;
  function openLogDialog(log = null) {
    const now = Date.now();
    dialogLog = log;
    let start, dur, title;
    if (log) {
      dur = log.actual || 0;
      start = log.startedAt || (log.endedAt - dur);
      title = log.title || '';
    } else {
      const today = dayStartOf(now);
      if (view.day === today) {
        start = now - 30 * 60000;
        start -= start % (5 * 60000);              // 5분 단위로 맞춤
      } else {
        start = view.day + 60 * 60000;             // 보고 있는 날 오전 10시
      }
      dur = 30 * 60000;
      title = '';
    }
    const t = Math.round(dur / 1000);
    el.addHeading.textContent = log ? '기록 수정' : '기록 직접 추가';
    el.addSave.textContent = log ? '저장' : '추가';
    el.addName.value = title;
    el.addStart.value = toLocalInput(start);
    el.addStart.max = toLocalInput(now);
    el.addH.value = String(Math.floor(t / 3600));
    el.addM.value = String(Math.floor((t % 3600) / 60));
    el.addS.value = String(t % 60);
    el.addError.hidden = true;
    el.addDialog.showModal();
    (log ? el.addStart : el.addName).focus();
  }
  const openAddDialog = () => openLogDialog(null);

  function submitAdd() {
    const showError = (msg) => { el.addError.textContent = msg; el.addError.hidden = false; };
    const num = (inp) => Math.max(0, parseInt(inp.value, 10) || 0);
    const start = new Date(el.addStart.value).getTime();
    const dur = num(el.addH) * 3600000 + num(el.addM) * 60000 + num(el.addS) * 1000;
    if (!el.addStart.value || Number.isNaN(start)) return showError('시작 시간을 입력해 주세요.');
    if (start > Date.now()) return showError('시작 시간이 아직 오지 않았어요.');
    if (dur <= 0) return showError('걸린 시간을 입력해 주세요.');
    if (dur > 24 * 3600000) return showError('걸린 시간은 24시간 이하로 입력해 주세요.');

    const title = el.addName.value.trim();
    const endedAt = start + dur;
    if (dialogLog) {
      const log = dialogLog;
      const changes = { title, actual: dur, startedAt: start, endedAt };
      if (log.type === 'timer' && log.status === '완료') changes.over = Math.max(0, dur - (log.planned || 0));
      updateLog(log, changes);
      const day = dayStartOf(endedAt);
      if (day !== view.day) setViewDay(day);       // 다른 날로 옮겨졌으면 그 날로 이동
    } else {
      addLog({ type: 'manual', title, actual: dur, startedAt: start, endedAt, status: '직접 추가' });
    }
    dialogLog = null;
    el.addDialog.close();
  }

  // ===== 루프 =====
  function tick() {
    const T = state.timer;
    if (T.running) {
      T.remaining = T.endAt - Date.now();
      if (T.remaining <= 0 && !T.alerted) {
        T.alerted = true;
        if (state.mode !== 'timer') setMode('timer');
        startRing();
        notifyDone();
      }
    }
    render();
    const now = Date.now();
    if (now - lastPersist >= 1000) {
      lastPersist = now;
      persistLive();
      autosave();
    }
  }
  let lastPersist = 0;
  setInterval(tick, 50);

  // 오전 9시가 지나 '오늘'이 바뀌면 화면도 새 하루로
  let currentToday = dayStartOf(Date.now());
  setInterval(() => {
    const t = dayStartOf(Date.now());
    if (t === currentToday) return;
    const wasToday = view.day === currentToday;
    currentToday = t;
    if (wasToday) setViewDay(t);
    else { renderLogs(); updateNav(); }
  }, 30000);

  // ===== 이벤트 =====
  for (const row of PRESET_ROWS) {
    const rowEl = document.createElement('div');
    rowEl.className = 'preset-row';
    for (const [ms, label] of row) {
      const b = document.createElement('button');
      b.textContent = label;
      b.dataset.ms = String(ms);
      b.addEventListener('click', () => { if (state.mode !== 'timer') setMode('timer'); setDuration(ms); });
      rowEl.appendChild(b);
    }
    el.presets.appendChild(rowEl);
  }

  function holdRepeat(btn, fn) {
    let delay = null, repeat = null;
    const stop = () => { clearTimeout(delay); clearTimeout(repeat); };
    btn.addEventListener('pointerdown', (e) => {
      if (e.button !== 0) return;
      e.preventDefault();
      fn();
      // 길게 누르면 반복, 1.5초 이상 누르고 있으면 더 빨라짐
      let n = 0;
      delay = setTimeout(function loop() {
        fn();
        n++;
        repeat = setTimeout(loop, n > 16 ? 35 : 90);
      }, 450);
    });
    ['pointerup', 'pointerleave', 'pointercancel', 'blur'].forEach((ev) => btn.addEventListener(ev, stop));
    btn.addEventListener('contextmenu', (e) => e.preventDefault());
    btn.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); fn(); }
    });
  }
  holdRepeat(el.upMin, () => nudge(1, MIN_STEP));
  holdRepeat(el.downMin, () => nudge(-1, MIN_STEP));
  holdRepeat(el.upSec, () => nudge(1, SEC_STEP));
  holdRepeat(el.downSec, () => nudge(-1, SEC_STEP));

  el.mainBtn.addEventListener('click', primaryAction);
  el.resetBtn.addEventListener('click', resetAction);
  el.saveBtn.addEventListener('click', saveAction);
  el.modeTimer.addEventListener('click', () => setMode('timer'));
  el.modeStopwatch.addEventListener('click', () => setMode('stopwatch'));

  el.title.value = state.title;
  el.title.addEventListener('input', () => { state.title = el.title.value; store.set('title', state.title); });
  el.title.addEventListener('keydown', (e) => { if (e.key === 'Enter') el.title.blur(); });

  el.logClear.addEventListener('click', () => {
    const msg = `${dateText(view.day)} 기록 ${view.logs.length}개를 삭제할까요?` +
      (cloud.user ? ' 다른 기기에서도 사라지고, 되돌릴 수 없어요.' : ' 되돌릴 수 없어요.');
    if (confirm(msg)) clearViewDay();
  });
  el.logAdd.addEventListener('click', openAddDialog);
  el.addCancel.addEventListener('click', () => el.addDialog.close());
  el.addSave.addEventListener('click', submitAdd);
  [el.addName, el.addStart, el.addH, el.addM, el.addS].forEach((inp) =>
    inp.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); submitAdd(); } }));
  // 대화상자 바깥(어두운 영역)을 누르면 닫기
  el.addDialog.addEventListener('click', (e) => {
    if (e.target !== el.addDialog) return;
    const r = el.addDialog.getBoundingClientRect();
    const inside = e.clientX >= r.left && e.clientX <= r.right && e.clientY >= r.top && e.clientY <= r.bottom;
    if (!inside) el.addDialog.close();
  });
  el.dayPrev.addEventListener('click', () => goDay(-1));
  el.dayNext.addEventListener('click', () => goDay(1));
  el.dayToday.addEventListener('click', () => setViewDay(dayStartOf(Date.now())));
  acc.login.addEventListener('click', login);
  acc.logout.addEventListener('click', logout);

  const openLog = () => {
    document.body.classList.add('log-open');
    el.logToggle.setAttribute('aria-expanded', 'true');
    el.logClose.focus();
  };
  const closeLog = () => {
    if (!document.body.classList.contains('log-open')) return;
    document.body.classList.remove('log-open');
    el.logToggle.setAttribute('aria-expanded', 'false');
    el.logToggle.focus();
  };
  el.logToggle.addEventListener('click', openLog);
  el.logClose.addEventListener('click', closeLog);
  el.scrim.addEventListener('click', closeLog);

  el.bell.addEventListener('click', toggleBell);
  window.addEventListener('focus', closeDoneNotice);
  renderBell();

  if (!document.fullscreenEnabled) {
    el.fullscreen.hidden = true;
  } else {
    el.fullscreen.addEventListener('click', () => {
      if (document.fullscreenElement) document.exitFullscreen();
      else document.documentElement.requestFullscreen().catch(() => {});
    });
  }

  // 키보드: 스페이스 = 시작/정지, 위/아래 = 1분, Shift+위/아래 = 1초, S = 저장, R = 초기화
  document.addEventListener('keydown', (e) => {
    if (el.addDialog.open) return;
    const tag = e.target.tagName;
    if (tag === 'INPUT' || tag === 'TEXTAREA' || e.target.isContentEditable) return;
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    const step = e.shiftKey ? SEC_STEP : MIN_STEP;
    if (e.key === ' ' && tag !== 'BUTTON') { e.preventDefault(); primaryAction(); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); nudge(1, step); }
    else if (e.key === 'ArrowDown') { e.preventDefault(); nudge(-1, step); }
    else if (e.key === 's' || e.key === 'S') { saveAction(); }
    else if (e.key === 'r' || e.key === 'R') { resetAction(); }
    else if (e.key === 'Escape') { closeLog(); }
  });

  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') { tick(); syncWakeLock(); if (document.hasFocus()) closeDoneNotice(); }
  });

  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden') { persistLive(); autosave(true); }
  });
  window.addEventListener('pagehide', () => { persistLive(); autosave(true); });

  window.addEventListener('beforeunload', (e) => {
    if (state.timer.running || state.sw.running) { e.preventDefault(); e.returnValue = ''; }
  });

  restoreLive();
  if (recoveredAt) {
    const at = new Date(recoveredAt).toLocaleTimeString('ko-KR', { hour: 'numeric', minute: '2-digit' });
    showToast(`꺼졌던 ${at}에 멈춰 있어요. 그때까지 기록은 저장됐어요. 계속을 누르면 이어서 진행돼요.`);
  }
  syncWakeLock();
  render();
  watchView();
  initCloud();
})();
</script>
</body>
</html>
